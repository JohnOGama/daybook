<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault mockup</title>
<style>
  :root {
    --background: #000; --foreground: #fff; --card: #121212; --popover: #0d0d0d;
    --muted: #1f1f1f; --muted-foreground: #a3a3a3; --accent: #1f1f1f;
    --destructive: #ef4444; --signal: #d9a514; --border: #2e2e2e; --sidebar: #0a0a0a;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--sidebar); color: var(--foreground);
    font: 14px/1.5 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .mockbar { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted-foreground); }
  .mockbar b { font-weight: 500; margin-right: 8px; }
  .mockbar button { padding: 3px 10px; border-radius: 6px; color: var(--muted-foreground); }
  .mockbar button:hover { background: var(--accent); }
  .mockbar button.on { background: var(--muted); color: var(--foreground); }

  .shell { flex: 1; min-height: 0; display: flex; }
  .side { width: 224px; flex: none; padding: 12px; display: flex; flex-direction: column; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--card); font-weight: 600; }
  .brand span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #fff; color: #000; }
  .side h2 { font-size: 12px; font-weight: 500; color: var(--muted-foreground); margin: 20px 10px 4px; }
  .nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; font-weight: 500; }
  .nav.on { background: var(--muted); }
  .nav em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--muted-foreground); }
  .nav.quiet { font-weight: 400; color: var(--muted-foreground); }
  .side .foot { margin-top: auto; padding-top: 32px; }

  .wrap { flex: 1; min-width: 0; padding: 8px 0; display: flex; }
  main { flex: 1; min-width: 0; background: var(--background); border-left: 1px solid var(--border); border-radius: 16px 0 0 16px; overflow: hidden; display: flex; }

  .gate { margin: auto; width: 100%; max-width: 360px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .gate .mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); }
  .gate .mark svg { width: 20px; height: 20px; }
  .gate h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .gate p { color: var(--muted-foreground); }
  .warn { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); font-size: 13px; }
  .warn input { margin-top: 3px; accent-color: #fff; }

  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
  input.text, textarea.text, select.text { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: #161616; outline: none; font-size: 14px; font-weight: 400; }
  input.text:focus, textarea.text:focus { border-color: #777; }
  textarea.text { resize: vertical; min-height: 72px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn.primary { background: #fff; color: #000; }
  .btn.primary:disabled { opacity: .4; cursor: default; }
  .btn.outline { border: 1px solid var(--border); }
  .btn.outline:hover, .btn.ghost:hover, .icon:hover { background: var(--accent); }
  .btn.danger { color: var(--destructive); }
  .btn.danger:hover { background: rgb(239 68 68 / .12); }
  .icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--muted-foreground); }
  .icon:hover { color: var(--foreground); }

  .list { width: 288px; flex: none; border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .list header { display: flex; align-items: baseline; justify-content: space-between; padding: 8px 10px 0; }
  .list h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .list header span { font-size: 13px; color: var(--muted-foreground); }
  .search { position: relative; }
  .search svg { position: absolute; left: 10px; top: 9px; width: 14px; height: 14px; color: var(--muted-foreground); }
  .search input { padding-left: 30px; }
  .row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; }
  .row:hover { background: var(--accent); }
  .row.on { background: var(--muted); }
  .row svg { color: var(--muted-foreground); }
  .row div { min-width: 0; }
  .row strong, .row small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row strong { font-weight: 500; }
  .row small { font-size: 12px; color: var(--muted-foreground); }

  .pane { flex: 1; min-width: 0; overflow-y: auto; }
  .topline { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 16px 0; font-size: 13px; color: var(--muted-foreground); }
  article { max-width: 620px; margin: 0 auto; padding: 16px 32px 64px; }
  .title { display: flex; align-items: center; gap: 12px; }
  .title .glyph { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); }
  .title h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .title small { color: var(--muted-foreground); font-size: 13px; }
  .title .actions { margin-left: auto; display: flex; gap: 4px; }

  .fields { margin-top: 24px; border: 1px solid var(--border); border-radius: var(--radius); }
  .f { display: grid; grid-template-columns: 130px 1fr auto; align-items: center; gap: 12px; min-height: 48px; padding: 6px 8px 6px 14px; }
  .f + .f { border-top: 1px solid var(--border); }
  .f label, .f > span:first-child { color: var(--muted-foreground); font-size: 13px; }
  .f .v { min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .f .v.mask { letter-spacing: .12em; }
  .f .tools { display: flex; }
  .notes { margin-top: 20px; }
  .notes h3 { font-size: 13px; font-weight: 500; color: var(--muted-foreground); margin-bottom: 6px; }
  .updated { margin-top: 20px; font-size: 12px; color: var(--muted-foreground); }

  .types { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .types button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--muted-foreground); }
  .types button.on { background: #fff; border-color: #fff; color: #000; font-weight: 500; }
  .form { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
  .custom { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 8px; align-items: center; }
  .form .bar { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; }
  .form .bar div { display: flex; gap: 8px; }
  .lockhint { display: inline-flex; align-items: center; gap: 6px; }

  .menuwrap { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; width: 200px; padding: 4px; border: 1px solid rgb(255 255 255 / .1); border-radius: var(--radius); background: var(--popover); box-shadow: 0 12px 32px rgb(0 0 0 / .6); color: var(--foreground); }
  .menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 6px; text-align: left; font-size: 13px; }
  .menu button:hover { background: var(--accent); }
  .code { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); font-family: ui-monospace, Consolas, monospace; font-size: 15px; line-height: 1.7; text-align: center; letter-spacing: .04em; }
  .twobtn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .link { align-self: center; font-size: 13px; color: var(--muted-foreground); text-decoration: underline; text-underline-offset: 2px; }
  .link:hover { color: var(--foreground); }
  .lede { margin-top: 8px; color: var(--muted-foreground); }
  .picked { display: flex; align-items: center; gap: 10px; }
  .picked span { color: var(--muted-foreground); font-size: 13px; overflow-wrap: anywhere; }
  .toast { position: fixed; right: 20px; bottom: 20px; padding: 10px 14px; border: 1px solid rgb(255 255 255 / .1); border-radius: var(--radius); background: var(--popover); box-shadow: 0 12px 32px rgb(0 0 0 / .6); font-size: 13px; opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; pointer-events: none; }
  .toast.show { opacity: 1; transform: none; }
  @media (max-width: 860px) { .side { display: none; } .list { width: 220px; } }
</style>
</head>
<body>
<div class="mockbar"><b>Mockup, fake data</b><span id="jump"></span></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="wrap"><main id="main"></main></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const P = {
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', hash: '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
  book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  card: '<rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/>',
  id: '<rect width="18" height="14" x="3" y="5" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 17c.6-1.5 1.7-2 3-2s2.4.5 3 2M15 10h3M15 14h3"/>',
  login: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
  other: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff: '<path d="M10.7 5.1A10 10 0 0 1 22 12a14 14 0 0 1-2.2 3M6.6 6.6A14 14 0 0 0 2 12s3.5 7 10 7a9.700 9.700 0 0 0 5.400-1.600M2 2l20 20M9.900 9.900a3 3 0 0 0 4.200 4.200"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/>',
  plus: '<path d="M5 12h14M12 5v14"/>', search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.300-4.300"/>',
  edit: '<path d="M12 20h9"/><path d="M16.500 3.500a2.100 2.100 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  down: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  up: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  more: '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',
};
const icon = (n) => `<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const TYPES = {
  card:  { label: 'Card',  icon: 'card',  fields: [['Name on card'], ['Card number', 1], ['Expiry'], ['CVV', 1]] },
  id:    { label: 'ID',    icon: 'id',    fields: [['Kind of ID'], ['Number', 1], ['Expiry date']] },
  login: { label: 'Login', icon: 'login', fields: [['Website'], ['Username'], ['Password', 1]] },
  key:   { label: 'Key',   icon: 'key',   fields: [['Service'], ['Key or secret', 1]] },
  other: { label: 'Other', icon: 'other', fields: [] },
};

let items = [
  { id: 1, type: 'card', name: 'Travel card', sub: 'Ending 4242', updated: '9 Nov', notes: 'Use this one abroad, no foreign fees.',
    values: [['Name on card', 'Sample Person'], ['Card number', '4242 4242 4242 4242', 1], ['Expiry', '08/29'], ['CVV', '123', 1], ['Support line', '0800 000 000']] },
  { id: 2, type: 'id', name: 'Passport', sub: 'Expires 2031', updated: '2 Nov', notes: '',
    values: [['Kind of ID', 'Passport'], ['Number', 'X0000000', 1], ['Expiry date', '14 Mar 2031']] },
  { id: 3, type: 'id', name: 'National ID', sub: 'No expiry', updated: '2 Nov', notes: '',
    values: [['Kind of ID', 'National ID'], ['Number', '0000-0000-0000', 1], ['Expiry date', 'None']] },
  { id: 4, type: 'login', name: 'Work email', sub: 'sample@example.com', updated: '28 Oct', notes: '',
    values: [['Website', 'mail.example.com'], ['Username', 'sample@example.com'], ['Password', 'not-a-real-password', 1]] },
  { id: 5, type: 'key', name: 'Payments API key', sub: 'Example Payments', updated: '21 Oct', notes: 'Test mode only.',
    values: [['Service', 'Example Payments'], ['Key or secret', 'example_key_0000000000000000', 1]] },
  { id: 6, type: 'key', name: 'Server secret', sub: 'Staging box', updated: '12 Oct', notes: '',
    values: [['Service', 'Staging box'], ['Key or secret', 'example_secret_00000000', 1]] },
  { id: 7, type: 'other', name: 'Home Wi-Fi', sub: '2 fields', updated: '3 Oct', notes: '',
    values: [['Network', 'Sample-Home'], ['Password', 'not-a-real-one', 1]] },
];

const RECOVERY_KEY = 'K7QM-2XPD-9RTF-W4HN-B6YC-3JLV-Z8GS-T5EA';
const BACKUP_FILE = 'daybook-vault-backup-2026-11-10.json';
const BACKUP = [
  { type: 'card', name: 'Old savings card', sub: 'Ending 1111', values: [['Card number', '4111 1111 1111 1111', 1]] },
  { type: 'login', name: 'Old school portal', sub: 'sample.person', values: [['Password', 'not-a-real-password', 1]] },
  { type: 'key', name: 'Maps API key', sub: 'Example Maps', values: [['Key or secret', 'example_maps_00000000', 1]] },
];

const S = { screen: 'locked', selected: 1, adding: false, importing: 0, menu: false, addType: 'card', custom: [], revealed: new Set(), q: '' };
const $ = (id) => document.getElementById(id);

function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderJump() {
  const on = S.screen === 'vault' && S.adding ? 'add' : S.screen === 'vault' && S.importing ? 'import' : S.screen;
  $('jump').innerHTML = [['setup', 'First time'], ['key', 'Recovery key'], ['locked', 'Locked'], ['recover', 'Forgot passcode'], ['vault', 'Unlocked'], ['add', 'Add item'], ['import', 'Import backup']]
    .map(([k, l]) => `<button class="${k === on ? 'on' : ''}" data-jump="${k}">${l}</button>`).join('');
}

function renderSide() {
  $('side').innerHTML = `
    <div class="brand"><span>${icon('check')}</span>Daybook</div>
    <h2>Spaces</h2>
    <div class="nav">${icon('hash')}My List<em>4</em></div>
    <div class="nav">${icon('book')}Notes</div>
    <div class="nav on">${icon('lock')}Personal vault</div>
    <div class="foot">
      <div class="nav quiet">${icon('trash')}Trash</div>
      <div class="nav quiet">${icon('out')}Sign out</div>
    </div>`;
}

function renderSetup() {
  return `<form class="gate" data-form="setup">
    <div class="mark">${icon('lock')}</div>
    <h1>Set a vault passcode</h1>
    <p>Everything in this vault is encrypted in your browser with this passcode. It's separate from your Daybook password.</p>
    <label class="field">Passcode<input class="text" type="password" autocomplete="off"></label>
    <label class="field">Type it again<input class="text" type="password" autocomplete="off"></label>
    <label class="warn"><input type="checkbox" id="ack"><span>I understand that if I forget this passcode and lose my recovery key, nobody can recover what's in the vault.</span></label>
    <button class="btn primary" id="create" disabled>Create vault</button>
  </form>`;
}

function renderLocked() {
  return `<form class="gate" data-form="unlock">
    <div class="mark">${icon('lock')}</div>
    <h1>Personal vault is locked</h1>
    <label class="field">Passcode<input class="text" type="password" autocomplete="off" id="pass" placeholder="Anything works in this mockup"></label>
    <button class="btn primary">Unlock</button>
    <button type="button" class="link" data-act="forgot">Forgot passcode?</button>
  </form>`;
}

function renderKey() {
  return `<form class="gate" data-form="key">
    <div class="mark">${icon('key')}</div>
    <h1>Save your recovery key</h1>
    <p>If you forget your passcode, this is the only way back in. You'll only see it this once.</p>
    <div class="code">${RECOVERY_KEY}</div>
    <div class="twobtn">
      <button type="button" class="btn outline" data-copy="Recovery key">${icon('copy')}Copy</button>
      <button type="button" class="btn outline" data-act="savekey">${icon('down')}Download</button>
    </div>
    <label class="warn"><input type="checkbox" id="saved"><span>I've saved it somewhere outside Daybook.</span></label>
    <button class="btn primary" id="continue" disabled>Continue</button>
  </form>`;
}

function renderRecover() {
  return `<form class="gate" data-form="recover">
    <div class="mark">${icon('key')}</div>
    <h1>Recover your vault</h1>
    <p>Enter your recovery key and choose a new passcode. Everything in the vault stays as it is.</p>
    <label class="field">Recovery key<input class="text" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX-..."></label>
    <label class="field">New passcode<input class="text" type="password" autocomplete="off"></label>
    <label class="field">Type it again<input class="text" type="password" autocomplete="off"></label>
    <button class="btn primary">Set new passcode</button>
    <button type="button" class="link" data-act="back">Back to unlock</button>
    <button type="button" class="link" data-act="erase">Lost your recovery key too?</button>
  </form>`;
}

function importHtml() {
  if (S.importing === 1) {
    return `<article>
      <div class="title"><div><h2>Import a backup</h2></div></div>
      <p class="lede">Works with a backup from this account or any other Daybook account.</p>
      <form class="form" data-form="open-backup">
        <div class="field picked"><button type="button" class="btn outline" data-act="pick">${icon('up')}Choose file</button><span>${BACKUP_FILE}</span></div>
        <label class="field">Passcode or recovery key from when it was exported<input class="text" type="password" autocomplete="off"></label>
        <div class="bar"><span></span><div><button type="button" class="btn outline" data-act="cancel">Cancel</button><button class="btn primary">Open backup</button></div></div>
      </form>
    </article>`;
  }
  const rows = BACKUP.map((item, n) => {
    const key = 'backup:' + n, [label, value] = item.values[0], shown = S.revealed.has(key);
    return `<div class="f"><span>${esc(item.name)}</span>
      <span class="v ${shown ? '' : 'mask'}">${esc(shown ? value : mask(value))}</span>
      <span class="tools"><button class="icon" data-reveal="${key}" aria-label="${shown ? 'Hide' : 'Show'} ${esc(label)}">${icon(shown ? 'eyeoff' : 'eye')}</button></span></div>`;
  }).join('');
  return `<article>
    <div class="title"><div><h2>Backup from 10 Nov</h2><small>${BACKUP.length} items</small></div></div>
    <p class="lede">Have a look before bringing these in. They'll be added to this vault, and nothing here is replaced.</p>
    <div class="fields">${rows}</div>
    <div class="form"><div class="bar"><span></span><div><button type="button" class="btn outline" data-act="cancel">Cancel</button><button type="button" class="btn primary" data-act="doimport">Import ${BACKUP.length} items</button></div></div></div>
  </article>`;
}

function listHtml() {
  const q = S.q.toLowerCase();
  const shown = items.filter((i) => (i.name + ' ' + i.sub + ' ' + TYPES[i.type].label).toLowerCase().includes(q));
  return `<section class="list" aria-label="Vault items">
    <header><h1>Personal vault</h1><span>${items.length} items</span></header>
    <button class="btn outline" data-act="add">${icon('plus')}Add item</button>
    <div class="search">${icon('search')}<input class="text" id="q" placeholder="Search" value="${esc(S.q)}" aria-label="Search the vault"></div>
    <div id="rows">${shown.map((i) => `
      <button class="row ${!S.adding && i.id === S.selected ? 'on' : ''}" data-item="${i.id}">
        ${icon(TYPES[i.type].icon)}<div><strong>${esc(i.name)}</strong><small>${TYPES[i.type].label} · ${esc(i.sub)}</small></div>
      </button>`).join('') || '<p style="padding:8px 10px;color:var(--muted-foreground);font-size:13px">No items match.</p>'}
    </div>
  </section>`;
}

const mask = (v) => '•'.repeat(Math.min(Math.max(v.length, 8), 20));

function detailHtml() {
  const item = items.find((i) => i.id === S.selected);
  if (!item) return '<article></article>';
  const rows = item.values.map(([label, value, secret], n) => {
    const key = item.id + ':' + n, shown = !secret || S.revealed.has(key);
    return `<div class="f"><span>${esc(label)}</span>
      <span class="v ${shown ? '' : 'mask'}">${esc(shown ? value : mask(value))}</span>
      <span class="tools">
        ${secret ? `<button class="icon" data-reveal="${key}" aria-label="${shown ? 'Hide' : 'Show'} ${esc(label)}">${icon(shown ? 'eyeoff' : 'eye')}</button>` : ''}
        <button class="icon" data-copy="${esc(label)}" aria-label="Copy ${esc(label)}">${icon('copy')}</button>
      </span></div>`;
  }).join('');
  return `<article>
    <div class="title">
      <div class="glyph">${icon(TYPES[item.type].icon)}</div>
      <div><h2>${esc(item.name)}</h2><small>${TYPES[item.type].label}</small></div>
      <div class="actions">
        <button class="btn outline" data-act="edit">${icon('edit')}Edit</button>
        <button class="btn danger" data-act="delete">${icon('trash')}Delete</button>
      </div>
    </div>
    <div class="fields">${rows}</div>
    ${item.notes ? `<div class="notes"><h3>Notes</h3><p>${esc(item.notes)}</p></div>` : ''}
    <p class="updated">Updated ${esc(item.updated)}</p>
  </article>`;
}

function addHtml() {
  const t = TYPES[S.addType];
  const preset = t.fields.map(([l, secret]) => `<label class="field">${l}<input class="text" data-field="${l}" data-secret="${secret ? 1 : ''}" type="${secret ? 'password' : 'text'}" autocomplete="off"></label>`).join('');
  const custom = S.custom.map((c, n) => `<div class="custom">
      <input class="text" data-custom-label="${n}" placeholder="Field name" value="${esc(c.label)}" aria-label="Field name">
      <input class="text" data-custom-value="${n}" placeholder="Value" value="${esc(c.value)}" aria-label="Field value">
      <button type="button" class="icon" data-remove="${n}" aria-label="Remove field">${icon('x')}</button>
    </div>`).join('');
  return `<article>
    <div class="title"><div><h2>Add item</h2></div></div>
    <div class="types">${Object.entries(TYPES).map(([k, v]) => `<button type="button" class="${k === S.addType ? 'on' : ''}" data-type="${k}">${icon(v.icon)}${v.label}</button>`).join('')}</div>
    <form class="form" data-form="add">
      <label class="field">Name<input class="text" id="newname" placeholder="What is this?" autocomplete="off"></label>
      ${preset}${custom}
      <div><button type="button" class="btn outline" data-act="field">${icon('plus')}Add field</button></div>
      <label class="field">Notes<textarea class="text"></textarea></label>
      <div class="bar"><span></span><div><button type="button" class="btn outline" data-act="cancel">Cancel</button><button class="btn primary">Save</button></div></div>
    </form>
  </article>`;
}

function renderVault() {
  return `${listHtml()}<div class="pane">
    <div class="topline"><span class="lockhint">Locks after 5 minutes idle</span><button class="btn outline" data-act="lock">${icon('lock')}Lock now</button>
      <div class="menuwrap"><button class="icon" data-act="menu" aria-label="Vault options">${icon('more')}</button>
        ${S.menu ? `<div class="menu">
          <button data-act="export">${icon('down')}Export backup</button>
          <button data-act="import">${icon('up')}Import backup</button>
          <button data-act="change">${icon('edit')}Change passcode</button>
          <button data-act="newkey">${icon('key')}New recovery key</button>
        </div>` : ''}
      </div>
    </div>
    ${S.importing ? importHtml() : S.adding ? addHtml() : detailHtml()}
  </div>`;
}

function render() {
  renderJump();
  const screens = { setup: renderSetup, key: renderKey, locked: renderLocked, recover: renderRecover, vault: renderVault };
  $('main').innerHTML = screens[S.screen]();
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button, [data-jump]');
  if (!b) { if (S.menu) { S.menu = false; render(); } return; }
  const d = b.dataset;
  if (d.act === 'menu') { S.menu = !S.menu; return render(); }
  if (S.menu) { S.menu = false; render(); }
  if (d.jump) {
    S.adding = d.jump === 'add';
    S.importing = d.jump === 'import' ? 1 : 0;
    S.screen = d.jump === 'add' || d.jump === 'import' ? 'vault' : d.jump;
    S.custom = []; S.revealed.clear();
    return render();
  }
  if (d.item) { S.selected = +d.item; S.adding = false; S.importing = 0; S.revealed.clear(); return render(); }
  if (d.act === 'forgot') { S.screen = 'recover'; return render(); }
  if (d.act === 'back') { S.screen = 'locked'; return render(); }
  if (d.act === 'erase') return toast('Erase vault: you type ERASE to confirm, then everything is deleted for good.');
  if (d.act === 'savekey') return toast('Downloads the key as a text file.');
  if (d.act === 'export') return toast(`Downloaded ${BACKUP_FILE}, still encrypted.`);
  if (d.act === 'import') { S.importing = 1; S.adding = false; return render(); }
  if (d.act === 'pick') return toast('Opens your file picker.');
  if (d.act === 'change') return toast('Asks for your current passcode, then a new one.');
  if (d.act === 'newkey') return toast('Asks for your passcode, shows a new key once, and the old key stops working.');
  if (d.act === 'doimport') {
    items = [...BACKUP.map((item, n) => ({ ...item, id: Date.now() + n, updated: 'just now', notes: '' })), ...items];
    S.importing = 0; S.revealed.clear(); S.selected = items[0].id;
    render();
    return toast(`Imported ${BACKUP.length} items`);
  }
  if (d.reveal) { S.revealed.has(d.reveal) ? S.revealed.delete(d.reveal) : S.revealed.add(d.reveal); return render(); }
  if (d.copy) return toast(`${d.copy} copied. Clipboard clears in 30 seconds.`);
  if (d.type) { S.addType = d.type; S.custom = []; return render(); }
  if (d.remove) { S.custom.splice(+d.remove, 1); return render(); }
  if (d.act === 'add') { S.adding = true; S.importing = 0; S.custom = []; return render(); }
  if (d.act === 'cancel') { S.adding = false; S.importing = 0; S.revealed.clear(); return render(); }
  if (d.act === 'field') { S.custom.push({ label: '', value: '' }); return render(); }
  if (d.act === 'lock') { S.screen = 'locked'; S.revealed.clear(); return render(); }
  if (d.act === 'edit') return toast('Edit uses the same form as Add item.');
  if (d.act === 'delete') return toast('Asks to confirm, then moves to Trash, still encrypted.');
});

document.addEventListener('input', (e) => {
  const d = e.target.dataset;
  if (d.customLabel !== undefined) S.custom[+d.customLabel].label = e.target.value;
  if (d.customValue !== undefined) S.custom[+d.customValue].value = e.target.value;
  if (e.target.id === 'q') {
    S.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const q = $('q'); q.focus(); q.setSelectionRange(pos, pos);
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'ack') $('create').disabled = !e.target.checked;
  if (e.target.id === 'saved') $('continue').disabled = !e.target.checked;
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target.dataset.form;
  if (form === 'setup') { S.screen = 'key'; return render(); }
  if (form === 'open-backup') { S.importing = 2; S.revealed.clear(); return render(); }
  if (form === 'key' || form === 'unlock' || form === 'recover') {
    S.screen = 'vault'; S.adding = false; S.importing = 0;
    render();
    if (form === 'recover') toast('New passcode set. Your items are all still here.');
    return;
  }
  if (form === 'add') {
    const name = $('newname').value.trim() || 'Untitled item';
    const values = [...e.target.querySelectorAll('[data-field]')].map((i) => [i.dataset.field, i.value || '(empty)', i.dataset.secret ? 1 : undefined]);
    S.custom.filter((c) => c.label).forEach((c) => values.push([c.label, c.value || '(empty)']));
    const id = Date.now();
    items = [{ id, type: S.addType, name, sub: 'Just added', updated: 'just now', notes: e.target.querySelector('textarea').value, values }, ...items];
    S.selected = id; S.adding = false; S.custom = [];
    render();
    toast(`Saved "${name}"`);
  }
});

renderSide();
render();
</script>
</body>
</html>
