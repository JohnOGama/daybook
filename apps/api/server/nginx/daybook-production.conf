# Simple nginx site: one file per env (daybook-<env>.conf).
# Placeholders: api.daybook.fitness, 80, 3001, 9m.

server {
    listen 90;
    server_name daybook.ogama.one;

    client_max_body_size 9m;

    # Realtime WebSockets (WebSocket upgrade)
    location /api/realtime/ {
        proxy_pass http://localhost:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Better Auth (needs correct Host + X-Forwarded-Proto for cookies/redirects)
    location /api/auth/ {
        proxy_pass http://localhost:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://localhost:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
